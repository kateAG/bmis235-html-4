<h1>2027 Roadtrip to Boston</h1>
<p>I have 3 cats at home.</p>
<p>I want to tell you my cats names and how old they are.</p>

<!-- ===== SHOWCASE ======================================================
     This box is empty on purpose. In Part 7 you paste an interactive

<div class="showcase"><!-- HTML: a cat face whose eyes follow the pointer (tap it for a message), a title, and three tiles for days, hours and minutes. -->
<div class="cd-wrap" role="group" aria-label="Countdown to June 1st, 2027">
  <button class="cd-cat" type="button" aria-label="Pet the cat">
    <svg viewBox="0 0 120 100" aria-hidden="true">
      <polygon class="cd-fill" points="18,48 22,8 52,28" />
      <polygon class="cd-fill" points="102,48 98,8 68,28" />
      <ellipse class="cd-fill" cx="60" cy="58" rx="46" ry="38" />
      <circle class="cd-eye" cx="42" cy="52" r="10" />
      <circle class="cd-eye" cx="78" cy="52" r="10" />
      <circle class="cd-pupil" cx="42" cy="52" r="5" />
      <circle class="cd-pupil" cx="78" cy="52" r="5" />
      <polygon class="cd-nose" points="55,67 65,67 60,73" />
      <path class="cd-line" d="M60 73 Q54 80 48 76 M60 73 Q66 80 72 76" />
      <path class="cd-line" d="M30 68 L8 64 M30 74 L8 78 M90 68 L112 64 M90 74 L112 78" />
    </svg>
  </button>
  <div class="cd-bubble" aria-live="polite">Tap me!</div>
  <div class="cd-title">Countdown to June 1st, 2027</div>
  <div class="cd-tiles">
    <div class="cd-tile"><span class="cd-num" data-unit="days">0</span><span class="cd-label">Days</span></div>
    <div class="cd-tile"><span class="cd-num" data-unit="hours">00</span><span class="cd-label">Hours</span></div>
    <div class="cd-tile"><span class="cd-num" data-unit="minutes">00</span><span class="cd-label">Minutes</span></div>
  </div>
</div>

<!-- CSS: brand colors, font and layout. Every rule starts with .showcase so nothing else on your page is affected. -->
<style>
  .showcase .cd-wrap {
    --cd-main: #E4ECED;
    --cd-accent: #3A6F9C;
    --cd-ink: #1F3B52;
    box-sizing: border-box;
    max-width: 560px;
    max-height: 480px;
    margin: 0 auto;
    padding: 16px 14px 18px;
    overflow: hidden;
    text-align: center;
    background: var(--cd-main);
    color: var(--cd-accent);
    border: 2px solid var(--cd-accent);
    border-radius: 20px;
    font-family: "Gurmukhi MT", "Gurmukhi Sangam MN", Georgia, serif;
  }
  .showcase .cd-wrap *,
  .showcase .cd-wrap *::before,
  .showcase .cd-wrap *::after {
    box-sizing: border-box;
  }
  .showcase .cd-cat {
    display: block;
    width: 110px;
    margin: 0 auto;
    padding: 0;
    background: none;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .showcase .cd-cat:focus-visible {
    outline: 3px solid var(--cd-accent);
    outline-offset: 4px;
    border-radius: 12px;
  }
  .showcase .cd-cat svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .showcase .cd-cat.cd-wiggle {
    animation: cd-wiggle 0.5s ease;
  }
  .showcase .cd-fill { fill: var(--cd-accent); }
  .showcase .cd-eye { fill: var(--cd-main); }
  .showcase .cd-pupil { fill: var(--cd-ink); }
  .showcase .cd-nose { fill: var(--cd-main); }
  .showcase .cd-line {
    fill: none;
    stroke: var(--cd-main);
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  .showcase .cd-bubble {
    display: inline-block;
    min-height: 1.6em;
    margin: 6px 0 4px;
    padding: 2px 14px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--cd-ink);
    background: #fff;
    border: 1.5px solid var(--cd-accent);
    border-radius: 999px;
  }
  .showcase .cd-title {
    margin: 6px 0 12px;
    font-size: clamp(1.05rem, 4.6vw, 1.4rem);
    font-weight: bold;
    line-height: 1.25;
  }
  .showcase .cd-tiles {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .showcase .cd-tile {
    flex: 1 1 0;
    min-width: 0;
    max-width: 150px;
    padding: 12px 4px 10px;
    color: var(--cd-main);
    background: var(--cd-accent);
    border-radius: 14px;
  }
  .showcase .cd-num {
    display: block;
    font-size: clamp(1.9rem, 9vw, 2.9rem);
    font-weight: bold;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .showcase .cd-label {
    display: block;
    margin-top: 4px;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  @keyframes cd-wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-6deg); }
    75% { transform: rotate(6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .showcase .cd-cat.cd-wiggle { animation: none; }
  }
</style>

<!-- JavaScript: runs the countdown every second, moves the cat's eyes toward the pointer, and cycles cat messages when the cat is tapped. -->
<script>
  (function () {
    var wraps = document.querySelectorAll(".showcase .cd-wrap");

    // June 1st, 2027 at midnight, in the visitor's local time
    var target = new Date(2027, 5, 1, 0, 0, 0).getTime();

    function pad(n) { return n < 10 ? "0" + n : String(n); }

    function setupCountdown(wrap) {
      var days = wrap.querySelector('[data-unit="days"]');
      var hours = wrap.querySelector('[data-unit="hours"]');
      var minutes = wrap.querySelector('[data-unit="minutes"]');
      var title = wrap.querySelector(".cd-title");
      var timer;

      function tick() {
        var diff = target - Date.now();
        if (diff <= 0) {
          days.textContent = "0";
          hours.textContent = "00";
          minutes.textContent = "00";
          title.textContent = "It's June 1st! 🎉";
          clearInterval(timer);
          return;
        }
        days.textContent = Math.floor(diff / 86400000);
        hours.textContent = pad(Math.floor((diff % 86400000) / 3600000));
        minutes.textContent = pad(Math.floor((diff % 3600000) / 60000));
      }

      tick();
      timer = setInterval(tick, 1000);
    }

    function setupCat(wrap) {
      var cat = wrap.querySelector(".cd-cat");
      var svg = cat.querySelector("svg");
      var pupils = svg.querySelectorAll(".cd-pupil");
      var bubble = wrap.querySelector(".cd-bubble");
      var daysEl = wrap.querySelector('[data-unit="days"]');
      var i = 0;

      // Eyes follow the pointer
      document.addEventListener("pointermove", function (e) {
        var r = svg.getBoundingClientRect();
        var dx = e.clientX - (r.left + r.width / 2);
        var dy = e.clientY - (r.top + r.height / 2);
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var move = 3.5 * Math.min(1, dist / 150);
        var x = (dx / dist) * move;
        var y = (dy / dist) * move;
        for (var p = 0; p < pupils.length; p++) {
          pupils[p].style.transform = "translate(" + x + "px," + y + "px)";
        }
      });

      // Tap the cat for a message
      cat.addEventListener("click", function () {
        var messages = [
          "Purrrr…",
          "Mrrrow!",
          "Only " + daysEl.textContent + " days to go!",
          "Is it dinner time?"
        ];
        bubble.textContent = messages[i % messages.length];
        i++;
        cat.classList.remove("cd-wiggle");
        void cat.offsetWidth; // restart the animation
        cat.classList.add("cd-wiggle");
      });
    }

    for (var w = 0; w < wraps.length; w++) {
      setupCountdown(wraps[w]);
      setupCat(wraps[w]);
    }
  })();
</script></div>
